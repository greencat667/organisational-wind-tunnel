# Builds the browser-only version (the simulation runs in the visitor's browser via Pyodide) and publishes it to
# GitHub Pages. One click: Actions → "Deploy browser version to GitHub Pages" → Run workflow.
# Requires Settings → Pages → Source: GitHub Actions. The simulation's tests must pass before anything is published.
name: Deploy browser version to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # the version Pyodide runs in the browser
      # the simulator's tests need only these (Laya, FastAPI and the Apple model are local-server extras)
      - run: pip install "pydantic>=2.8" "pytest>=8.0"
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5     # fails clearly if Pages isn't set to "GitHub Actions"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:static
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
